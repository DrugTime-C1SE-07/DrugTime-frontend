name: drugtime_mobile
description: "DrugTime - Medication Reminder and Care Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.17
  flutter_secure_storage: ^10.3.4
  path: ^1.9.0
  sqflite_sqlcipher: ^3.2.1
  http: ^1.6.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^5.1.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  app_links: ^6.4.1
  permission_handler: ^12.0.1
  share_plus: ^12.0.2
  google_mlkit_text_recognition: 0.17.1
  image_picker: 1.2.4
  path_provider: 2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true

  # Khai báo theo thư mục: thêm ảnh mới vào đây là dùng được, không cần sửa lại.
  assets:
    - assets/icons/
    - assets/icons/profile/
    - assets/images/
