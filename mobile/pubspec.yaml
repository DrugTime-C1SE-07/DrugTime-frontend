name: drugtime_mobile
description: "DrugTime - Medication Reminder and Care Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Khai báo theo thư mục: thêm ảnh mới vào đây là dùng được, không cần sửa lại.
  assets:
    - assets/icons/
    - assets/images/
